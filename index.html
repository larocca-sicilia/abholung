<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>La Rocca – Abholung</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="https://i.postimg.cc/jSGnf9L6/larocca-sicilia.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/WpFd5zcs/app-icon.png">
  <meta name="apple-mobile-web-app-title" content="Abholung">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fdf2e9;
      overflow: hidden;
    }
    #laden {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: bold;
      color: #d35400;
      background: #fdf2e9;
      z-index: 1;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 2;
      background: #fdf2e9;
    }
  </style>
</head>
<body>

  <div id="laden">Einen Moment …</div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwqmzzx5abuDxQo4bh8SDc72g_uyU2PuiguBdLNrqLWCYlBJ-joYypsgjv00tu_-9lT/exec?app=1"
    title="Abholung"></iframe>

  <script>
    document.getElementById('app').addEventListener('load', function () {
      var l = document.getElementById('laden');
      if (l) { l.style.display = 'none'; }
    });
  </script>

</body>
</html>
